name: CourseAxis
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_LANGUAGE: zh-Hans
    DEVELOPMENT_TEAM: ""
targets:
  CourseAxis:
    type: application
    platform: macOS
    sources:
      - path: CourseAxisApp
      - path: Shared
      - path: Assets.xcassets
      - path: ../providers
        type: folder
        buildPhase: resources
      - path: Resources/container-migration.plist
        buildPhase: resources
    info:
      path: Config/AppInfo.plist
      properties:
        CFBundleDisplayName: 课轴
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: CourseAxis
            CFBundleURLSchemes:
              - courseaxis
        LSMultipleInstancesProhibited: true
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.dev.shusenzheng64.courseaxis
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shusenzheng64.courseaxis
        PRODUCT_NAME: CourseAxis
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 1.5.0
        CURRENT_PROJECT_VERSION: 10
    dependencies:
      - target: CourseAxisWidget
        embed: true
  CourseAxisWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: CourseAxisWidget
      - path: Shared
    info:
      path: Config/WidgetInfo.plist
      properties:
        CFBundleDisplayName: 课轴小组件
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.dev.shusenzheng64.courseaxis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shusenzheng64.courseaxis.widget
        PRODUCT_NAME: CourseAxisWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 1.5.0
        CURRENT_PROJECT_VERSION: 10
schemes:
  CourseAxis:
    build:
      targets:
        CourseAxis: all
        CourseAxisWidget: all
    run:
      config: Debug
    archive:
      config: Release
