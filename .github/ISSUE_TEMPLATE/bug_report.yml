name: 缺陷报告
description: 使用完全合成数据报告可复现的 CourseAxis 问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        禁止提交真实账号、学号、课程、考试、教师、地点、Cookie、Token、完整响应或身份截图。安全问题请使用仓库 Security 私密报告。
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android
        - macOS
        - 自托管同步服务
        - 构建或文档
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CourseAxis 版本
      placeholder: 例如 1.5.0 或 commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 只使用从零编写的合成数据，逐步说明操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 已运行的验证
      description: 填写测试、构建或诊断命令；不要粘贴敏感日志。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容和附件不含任何真实个人、学校账号、课程或秘密数据。
          required: true
        - label: 我确认这不是需要私密披露的安全漏洞。
          required: true
